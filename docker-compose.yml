# รัน PostgreSQL + Keycloak (auth): docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tablebook
      POSTGRES_PASSWORD: tablebook
      POSTGRES_DB: tablebook
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  # Keycloak ใช้ storage ของตัวเอง (dev mode) แยกจาก Postgres ของแอป
  # import realm ตัวอย่างอัตโนมัติจาก keycloak/tablebook-realm.json ตอนเริ่มครั้งแรก
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/tablebook-realm.json:/opt/keycloak/data/import/tablebook-realm.json:ro
      - keycloak_data:/opt/keycloak/data
  # ตั้งรหัสผ่านบัญชีทดสอบผ่าน Admin REST API หลัง Keycloak พร้อม (รันครั้งเดียวแล้วออก)
  # แยกจาก tablebook-realm.json เพื่อไม่ให้มีรหัสผ่าน plaintext อยู่ในไฟล์ realm export ที่ commit ลง git
  keycloak-seed:
    image: curlimages/curl:8.11.0
    depends_on:
      - keycloak
    volumes:
      - ./keycloak/seed-passwords.sh:/seed-passwords.sh:ro
    environment:
      SEED_PASSWORD: password123
    entrypoint: ["sh", "/seed-passwords.sh"]
volumes:
  dbdata:
  keycloak_data:
